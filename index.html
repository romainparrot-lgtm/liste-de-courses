<body>

</div></div>
<script>var KEY='courses_data',CFG='courses_cfg';
var R=[["Fruits et légumes","pomme poire banane orange citron tomate carotte salade courgette oignon ail patate legume fruit fraise raisin concombre poireau champignon avocat"],["Boulangerie","pain baguette brioche croissant"],["Frais","lait beurre oeuf yaourt fromage creme jambon"],["Viandes et poissons","poulet steak boeuf porc saucisse poisson saumon thon viande"],["Épicerie","pate riz cafe sucre farine huile sel conserve biscuit cereale chocolat sauce"],["Boissons","eau jus soda biere vin"],["Surgelés","surgele glace pizza"],["Maison et hygiène","savon shampoing dentifrice papier lessive eponge"]];
var TRASH='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>';
var CHECK='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';
function $(i){return document.getElementById(i)}
function norm(s){return s.toLowerCase().replace(/œ/g,'oe').normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function aisle(n){
  var w=norm(n).split(/[^a-z]+/).filter(Boolean);
  for(var i=0;i<R.length;i++){
    var ks=R[i][1].split(' ');
    if(w.some(function(x){return ks.some(function(y){return y.length<=3?(x===y||x===y+'s'):(x.indexOf(y)===0||(x.length>3&&y.indexOf(x)===0))})}))return R[i][0];
  }
  return 'Autre';
}

var data={v:3,items:[],spend:[]},cfg={repo:'',token:''},sha=null,busy=false,stat='local';
var DID='x';try{DID=localStorage.getItem('courses_did')||Math.random().toString(36).slice(2,8);localStorage.setItem('courses_did',DID)}catch(e){}
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&Array.isArray(p.items))data.items=p.items.map(function(x){if(typeof x.id==='number')x.id='l'+x.id;if(!x.u)x.u=Date.now();return x})}}catch(e){}
try{var rw=localStorage.getItem(KEY);if(rw){var pp=JSON.parse(rw);if(pp&&Array.isArray(pp.spend))data.spend=pp.spend}}catch(e){}
try{var c=localStorage.getItem(CFG);if(c)cfg=JSON.parse(c)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function saveCfg(){try{localStorage.setItem(CFG,JSON.stringify(cfg))}catch(e){}}
function live(){return data.items.filter(function(x){return !x.d})}
function find(id){return data.items.find(function(i){return i.id===id&&!i.d})}
function changed(){save();render();clearTimeout(changed.t);changed.t=setTimeout(sync,600)}

var FB={'fruits-et-legumes':'#3f8f4a','boulangerie':'#b9772f','frais':'#4a86b8','viandes-et-poissons':'#b5483f','epicerie':'#8a6a3b','boissons':'#2f7f8f','surgeles':'#5a7fb0','maison-et-hygiene':'#6b5aa6','autre':'#5d6b63'};
function slug(a){return norm(a).replace(/[^a-z]+/g,'-').replace(/^-|-$/g,'')}
function ban(a){var k=slug(a);return '<div class="ban" style="background:linear-gradient(rgba(0,0,0,.08),rgba(0,0,0,.6)),url(images/rayon-'+k+'.jpg) center/cover,'+(FB[k]||'#5d6b63')+'">'+a+'</div>'}
function row(x){
  var ck='<button class="ck'+(x.c?' on':'')+'" data-a="tg" data-id="'+x.id+'" aria-label="'+(x.c?'Remettre dans la liste':'Mettre dans le panier')+'">'+(x.c?CHECK:'')+'</button>';
  var right=x.c?(x.q>1?'<span class="x">x'+x.q+'</span>':''):'<div class="qt"><button data-a="m" data-id="'+x.id+'" aria-label="Moins">−</button><b>'+x.q+'</b><button data-a="p" data-id="'+x.id+'" aria-label="Plus">+</button></div>';
  return '<div class="w"><div class="bgd">'+TRASH+'</div><div class="fr'+(x.c?' done':'')+'" data-id="'+x.id+'">'+ck+'<span class="nm">'+esc(x.n)+'</span>'+right+'</div></div>';
}
function render(){
  var L=live(),todo=L.filter(function(x){return !x.c}),done=L.filter(function(x){return x.c});
  $('sub').textContent=todo.length+' à acheter · '+done.length+' dans le panier';
  $('clr').className=done.length?'':'off';$('clrn').textContent=done.length;
  var h='';
  R.map(function(r){return r[0]}).concat('Autre').forEach(function(a){
    var l=todo.filter(function(x){return x.a===a});
    if(l.length)h+='<div class="box">'+ban(a)+l.map(row).join('')+'</div>';
  });
  if(!todo.length)h+='<p class="empty">Rien à acheter pour le moment. Ajoutez un article ci-dessus.</p>';
  if(done.length)h+='<p class="sec">Dans le panier</p><div class="box">'+done.map(row).join('')+'</div>';
  $('list').innerHTML=h;
  document.querySelectorAll('.fr').forEach(bind);
}
var noClick=0;
function bind(f){
  var id=f.dataset.id,bg=f.previousElementSibling,sx=0,sy=0,dx=0,t0=0,on=false,mv=false;
  function back(){f.style.transition='transform .2s';f.style.transform='translateX(0)';setTimeout(function(){bg.style.opacity=0},200)}
  f.onpointerdown=function(e){on=true;mv=false;sx=e.clientX;sy=e.clientY;dx=0;t0=Date.now()};
  f.onpointermove=function(e){
    if(!on)return;
    var mx=e.clientX-sx,my=e.clientY-sy;
    if(!mv){
      if(Math.abs(my)>12&&Math.abs(my)>Math.abs(mx)){on=false;return}
      if(mx<-6&&Math.abs(mx)>Math.abs(my)){mv=true;try{f.setPointerCapture(e.pointerId)}catch(x){}f.style.transition='none';sx=e.clientX-(mx+6);}
      else return;
      mx=e.clientX-sx;
    }
    dx=Math.min(0,mx);
    f.style.transform='translateX('+dx+'px)';
    bg.style.opacity=Math.min(1,-dx/40);
  };
  f.onpointerup=function(){
    if(!on)return;on=false;
    if(!mv)return;
    noClick=Date.now()+350;
    var dt=Math.max(1,Date.now()-t0),v=-dx/dt;
    if(dx<-Math.min(70,f.offsetWidth*.22)||(dx<-30&&v>.5)){
      f.style.transition='transform .2s';f.style.transform='translateX(-110%)';
      setTimeout(function(){var x=find(id);if(x){x.d=1;x.u=Date.now()}changed()},180);
    }else back();
  };
  f.onpointercancel=function(){if(!on)return;on=false;if(mv)back()};
}
$('list').addEventListener('click',function(e){
  if(Date.now()<noClick)return;
  var b=e.target.closest('button[data-a]');if(!b)return;
  var x=find(b.dataset.id);if(!x)return;
  var a=b.dataset.a;
  if(a==='tg')x.c=x.c?0:1;
  if(a==='p')x.q+=1;
  if(a==='m')x.q=Math.max(1,x.q-1);
  x.u=Date.now();changed();
});
function add(){
  var i=$('in'),n=i.value.trim();if(!n)return;
  var m=n.match(/^(\d+)\s*x?\s+(.+)$/),q=1;
  if(m){q=+m[1];n=m[2]}
  n=n.charAt(0).toUpperCase()+n.slice(1);
  data.items.push({id:uid(),n:n,q:q,c:0,a:aisle(n),u:Date.now()});
  i.value='';changed();
}
$('addb').onclick=add;
$('in').onkeydown=function(e){if(e.key==='Enter')add()};
$('clr').onclick=function(){openTicket()};

function merge(a,b){
  var m={};a.concat(b).forEach(function(x){var y=m[x.id];if(!y||x.u>y.u)m[x.id]=x});
  var lim=Date.now()-2592000000;
  return Object.keys(m).map(function(k){return m[k]}).filter(function(x){return !(x.d&&x.u<lim)});
}
function same(a,b){
  if(a.length!==b.length)return false;
  var m={};b.forEach(function(x){m[x.id]=x.u});
  return a.every(function(x){return m[x.id]===x.u});
}
function enc(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o))))}
function dec(s){return JSON.parse(decodeURIComponent(escape(atob(s.replace(/\n/g,'')))))}
function api(method,body){
  return fetch('https://api.github.com/repos/'+cfg.repo+'/contents/liste.json',{method:method,cache:'no-store',headers:{'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json'},body:body?JSON.stringify(body):undefined});
}
function setStat(s){
  stat=s;var b=$('st'),t=$('stt');
  var L={local:['Local',''],ing:['Synchro…',''],ok:['Synchronisé','ok'],off:['Hors ligne',''],auth:['Accès refusé','bad'],err:['Erreur','bad']}[s];
  t.textContent=L[0];b.className=L[1];
}
async function sync(){
  if(!cfg.repo||!cfg.token){setStat('local');return stat}
  if(busy)return 'busy';
  if(!navigator.onLine){setStat('off');return stat}
  busy=true;setStat('ing');
  try{
    for(var t=0;t<3;t++){
      var r=await api('GET'),remote=[],rs=[];sha=null;
      if(r.status===401||r.status===403){setStat('auth');return stat}
      if(r.status!==404){
        if(!r.ok)throw new Error('get');
        var j=await r.json();sha=j.sha;
        try{var dj=dec(j.content);remote=dj.items||[];rs=dj.spend||[]}catch(e){}
      }
      var merged=merge(data.items,remote),ms=merge(data.spend,rs);
      if(!same(merged,data.items)||!same(ms,data.spend)){data.items=merged;data.spend=ms;save();render();if(view==='D')renderDep()}
      if(same(merged,remote)&&same(ms,rs)&&sha){setStat('ok');return stat}
      var body={message:'maj:'+DID,content:enc({v:3,items:merged,spend:ms})};
      if(sha)body.sha=sha;
      var w=await api('PUT',body);
      if(w.ok){setStat('ok');return stat}
      if(w.status===409||w.status===422)continue;
      if(w.status===401||w.status===403||w.status===404){setStat('auth');return stat}
      throw new Error('put');
    }
    setStat('err');
  }catch(e){setStat(navigator.onLine?'err':'off')}
  finally{busy=false}
  return stat;
}

var VAPID='BEynj2nHyirEQpj99qzutOefdt2dL1YXnWRBXIwGSp9cIHwfDwkl7ZEj22dvYA60k_1xq-eLD8lyGr8rYKNU7U4';
function u8(b){var p='='.repeat((4-b.length%4)%4),r=atob((b+p).replace(/-/g,'+').replace(/_/g,'/')),o=new Uint8Array(r.length);for(var i=0;i<r.length;i++)o[i]=r.charCodeAt(i);return o}
function aapi(method,body,f){return fetch('https://api.github.com/repos/'+cfg.repo+'/contents/'+(f||'abonnements.json'),{method:method,cache:'no-store',headers:{'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json'},body:body?JSON.stringify(body):undefined})}
async function saveSub(sub){
  for(var t=0;t<3;t++){
    var r=await aapi('GET'),list=[],sh=null;
    if(r.status!==404){if(!r.ok)return false;var j=await r.json();sh=j.sha;try{list=dec(j.content).subs||[]}catch(e){}}
    list=list.filter(function(x){return x.id!==DID});list.push({id:DID,sub:sub.toJSON()});
    var b={message:'abo:'+DID,content:enc({subs:list})};if(sh)b.sha=sh;
    var w=await aapi('PUT',b);
    if(w.ok)return true;
    if(w.status===409||w.status===422)continue;
    return false;
  }
  return false;
}
var tt=0;
function toast(m){var e=$('toast');e.textContent=m;e.className='on';clearTimeout(tt);tt=setTimeout(function(){e.className=''},2600)}
$('alt').onclick=async function(){
  if(!cfg.repo||!cfg.token){toast('Connectez d\'abord la synchronisation');return}
  if(!confirm('Envoyer une alerte à l\'autre téléphone ?'))return;
  var b=$('alt');b.className='go';toast('Envoi…');
  try{
    await sync();
    for(var t=0;t<3;t++){
      var r=await aapi('GET',null,'alerte.json'),sh=null;
      if(r.ok){sh=(await r.json()).sha}
      else if(r.status!==404){toast('Échec de l\'envoi');return}
      var body={message:'alerte:'+DID,content:enc({id:DID,t:Date.now()})};if(sh)body.sha=sh;
      var w=await aapi('PUT',body,'alerte.json');
      if(w.ok){toast('Alerte envoyée');return}
      if(w.status===409||w.status===422)continue;
      toast('Échec de l\'envoi');return;
    }
    toast('Échec de l\'envoi');
  }catch(e){toast('Échec de l\'envoi')}
  finally{b.className=''}
};
function alertState(){
  var m=$('pmsg');
  if(typeof Notification==='undefined'){m.textContent='Ajoutez d\'abord l\'appli à l\'écran d\'accueil pour activer les alertes.';m.style.color='';return}
  m.style.color='';
  m.textContent=Notification.permission==='granted'?'Alertes autorisées sur ce téléphone.':(Notification.permission==='denied'?'Alertes bloquées : à réautoriser dans Réglages > Notifications.':'');
}
$('alb').onclick=async function(){
  var m=$('pmsg');m.style.color='';
  try{
    if(!cfg.repo||!cfg.token){m.textContent='Connectez d\'abord la synchronisation ci-dessus.';return}
    if(typeof Notification==='undefined'||!('serviceWorker' in navigator)||!('PushManager' in window)){m.textContent='Ajoutez d\'abord l\'appli à l\'écran d\'accueil (iOS 16.4 minimum).';return}
    m.textContent='Activation…';
    var p=await Notification.requestPermission();
    if(p!=='granted'){m.textContent='Notifications refusées. À autoriser dans Réglages > Notifications.';return}
    var reg=await navigator.serviceWorker.ready;
    var sub=await reg.pushManager.getSubscription()||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(VAPID)});
    m.textContent=(await saveSub(sub))?'Alertes activées sur ce téléphone.':'Échec de l\'enregistrement. Réessayez.';
  }catch(e){m.textContent='Impossible d\'activer les alertes.'}
};
$('st').onclick=function(){alertState();$('rp').value=cfg.repo;$('tk').value=cfg.token;$('msg').textContent='';$('ov').hidden=false};
$('cn').onclick=function(){$('ov').hidden=true};
$('lo').onclick=function(){cfg={repo:'',token:''};saveCfg();$('ov').hidden=true;setStat('local')};
$('sv').onclick=async function(){
  var r=$('rp').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/+$/,'');
  var tk=$('tk').value.trim();
  if(!/^[\w.-]+\/[\w.-]+$/.test(r)||!tk){$('msg').textContent='Entrez le dépôt (nom/dépôt) et le jeton.';return}
  cfg={repo:r,token:tk};saveCfg();$('msg').textContent='Connexion…';
  var s=await sync();
  if(s==='ok'){$('ov').hidden=true}
  else if(s==='auth')$('msg').textContent='Accès refusé. Vérifiez le nom du dépôt et le droit Contents en lecture/écriture.';
  else if(s==='off')$('msg').textContent='Pas de connexion pour le moment.';
  else $('msg').textContent='Connexion impossible. Réessayez.';
};

var view='L',per='m',off=0;
function pad(n){return n<10?'0'+n:''+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function money(n){return new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(n||0)}
function fd(d){return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function rng(){
  var t=new Date(),s,e,lab;
  if(per==='w'){var d=new Date(t.getFullYear(),t.getMonth(),t.getDate()+off*7),wd=(d.getDay()+6)%7;s=new Date(d.getFullYear(),d.getMonth(),d.getDate()-wd);e=new Date(s.getFullYear(),s.getMonth(),s.getDate()+6);lab='Du '+fd(s)+' au '+fd(e)}
  else if(per==='m'){s=new Date(t.getFullYear(),t.getMonth()+off,1);e=new Date(s.getFullYear(),s.getMonth()+1,0);lab=cap(s.toLocaleDateString('fr-FR',{month:'long',year:'numeric'}))}
  else if(per==='y'){s=new Date(t.getFullYear()+off,0,1);e=new Date(s.getFullYear(),11,31);lab=''+s.getFullYear()}
  else return {a:'0000-00-00',b:'9999-99-99',lab:'Toutes les dépenses'};
  return {a:ymd(s),b:ymd(e),lab:lab};
}
function renderDep(){
  var r=rng(),L=data.spend.filter(function(x){return !x.d&&x.dt>=r.a&&x.dt<=r.b}).sort(function(a,b){return a.dt<b.dt?1:-1});
  var tot=0;
  L.forEach(function(x){tot+=x.t});
  var h='<div class="seg">'+[['w','Semaine'],['m','Mois'],['y','Année'],['t','Tout']].map(function(p){return '<button data-p="'+p[0]+'"'+(per===p[0]?' class="on"':'')+'>'+p[1]+'</button>'}).join('')+'</div>';
  if(per==='t')h+='<div class="nav"><b>'+r.lab+'</b></div>';
  else h+='<div class="nav"><button data-o="-1" aria-label="Période précédente">‹</button><b>'+r.lab+'</b><button data-o="1" class="'+(off>=0?'off':'')+'" aria-label="Période suivante">›</button></div>';
  h+='<div class="tot"><span>Total</span><b>'+money(tot)+'</b><small>'+L.length+(L.length>1?' passages en caisse':' passage en caisse')+'</small></div>';
  if(!L.length){h+='<p class="empty">Aucune dépense sur cette période. Le prix est demandé quand vous videz le panier.</p>'}
  else{
    h+='<div class="cd"><h3>Passages en caisse</h3>'+L.map(function(x){
      var dd=new Date(x.dt+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
      return '<div class="tr"><div class="th"><b>'+dd+'</b><b>'+money(x.t)+'</b></div><button data-del="'+x.id+'">Supprimer</button></div>';
    }).join('')+'</div>';
  }
  $('dep').innerHTML=h;
}
$('dep').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.p){per=b.dataset.p;off=0;renderDep()}
  else if(b.dataset.o){var o=+b.dataset.o;if(o>0&&off>=0)return;off+=o;renderDep()}
  else if(b.dataset.del){
    if(!confirm('Supprimer ce passage en caisse ?'))return;
    var x=data.spend.find(function(s){return s.id===b.dataset.del});
    if(x){x.d=1;x.u=Date.now()}
    changed();renderDep();
  }
});
try{(new Image()).src='fond-depenses.jpg'}catch(e){}
function show(v){
  view=v;
  document.documentElement.classList.toggle('dep',v==='D');
  $('tL').className=v==='L'?'on':'';$('tD').className=v==='D'?'on':'';
  document.querySelector('.add').style.display=v==='L'?'':'none';
  $('list').style.display=v==='L'?'':'none';
  document.querySelector('footer').style.display=v==='L'?'':'none';
  $('dep').style.display=v==='D'?'':'none';
  if(v==='D')renderDep();
}
$('tL').onclick=function(){show('L')};
$('tD').onclick=function(){show('D')};

function num(v){var n=parseFloat((v||'').replace(',','.'));return n>0?Math.round(n*100)/100:0}
function openTicket(){
  var done=live().filter(function(x){return x.c});
  if(!done.length)return;
  var n=done.reduce(function(s,x){return s+x.q},0);
  $('tn').textContent=n+(n>1?' articles dans le panier.':' article dans le panier.');
  $('tm').value='';$('td').value=ymd(new Date());$('ov2').hidden=false;
}
function finish(withPrice){
  var done=live().filter(function(x){return x.c});
  var total=withPrice?num($('tm').value):0;
  if(total)data.spend.push({id:uid(),dt:$('td').value||ymd(new Date()),t:total,u:Date.now()});
  done.forEach(function(x){x.d=1;x.u=Date.now()});
  $('ov2').hidden=true;changed();
}
$('tsv').onclick=function(){finish(true)};
$('tno').onclick=function(){finish(false)};
$('tcn').onclick=function(){$('ov2').hidden=true};

render();setStat(cfg.repo&&cfg.token?'ing':'local');sync();

document.addEventListener('visibilitychange',function(){if(!document.hidden)sync()});
window.addEventListener('online',sync);
window.addEventListener('offline',function(){if(cfg.repo)setStat('off')});

if('serviceWorker' in navigator){
  var had=!!navigator.serviceWorker.controller,pend=false;
  function tryReload(){
    if(!pend)return;
    if($('in').value||!$('ov').hidden||!$('ov2').hidden)return;
    location.reload();
  }
  navigator.serviceWorker.addEventListener('controllerchange',function(){if(had){pend=true;tryReload()}});
  setInterval(tryReload,3000);
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(function(reg){
    function chk(){reg.update().catch(function(){})}
    setInterval(function(){if(!document.hidden)chk()},60000);
    document.addEventListener('visibilitychange',function(){if(!document.hidden)chk()});
    window.addEventListener('online',chk);
  }).catch(function(){});
}
